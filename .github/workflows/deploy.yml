name: Build e deploy do site

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/conectpbx

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build para teste
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: site-test:ci

      - name: Teste de saúde do container
        run: |
          docker run -d --name site-test -p 8080:80 site-test:ci
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/ | grep -q "ConectPbx"
          docker rm -f site-test

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - name: Conferir secrets de deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          faltando=""
          [ -z "$SSH_HOST" ] && faltando="$faltando SSH_HOST"
          [ -z "$SSH_USER" ] && faltando="$faltando SSH_USER"
          [ -z "$SSH_KEY" ] && faltando="$faltando SSH_KEY"
          if [ -n "$faltando" ]; then
            echo "::error::Secrets ausentes:$faltando. Cadastre em Settings > Secrets and variables > Actions (ou no ambiente 'producao'). Veja docs/deploy.md."
            exit 1
          fi

      - name: Atualizar o container no servidor
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.IMAGE }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: GHCR_USER,GHCR_TOKEN,IMAGE
          script_stop: true
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE:latest"
            DEST="${{ secrets.DEPLOY_PATH }}"
            [ -z "$DEST" ] && DEST="$HOME/conectpbx"
            DEST="${DEST/#\~/$HOME}"
            echo "Pasta de deploy: $DEST"
            if [ ! -d "$DEST" ]; then
              echo "ERRO: a pasta $DEST não existe no servidor. Crie-a e copie deploy/docker-compose.yml para ela." >&2
              exit 1
            fi
            cd "$DEST"
            COMPOSE=""
            for f in docker-compose.yml docker-compose.yaml compose.yml compose.yaml; do
              [ -f "$f" ] && COMPOSE="$f" && break
            done
            if [ -z "$COMPOSE" ]; then
              echo "ERRO: nenhum arquivo docker-compose.yml em $DEST." >&2
              ls -la >&2
              exit 1
            fi
            if ! docker compose version >/dev/null 2>&1; then
              echo "ERRO: o plugin 'docker compose' não está instalado no servidor." >&2
              exit 1
            fi
            docker compose -f "$COMPOSE" up -d --remove-orphans 2>&1
            docker compose -f "$COMPOSE" ps
            docker image prune -f
            docker logout ghcr.io
