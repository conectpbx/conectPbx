server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  charset_types text/html text/css application/javascript text/plain;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }
  location /assets/ { expires 30d; add_header Cache-Control "public"; try_files $uri =404; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location / { try_files $uri $uri/ /index.html; }
}
